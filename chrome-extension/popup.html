<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>JJKC Algorithm Viewer</title>
    <style>
      * { box-sizing: border-box; }

      body {
        width: 430px;
        margin: 0;
        padding: 16px;
        font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background: #0b0b0f;
        color: #f5f5f5;
      }

      h1 { margin: 0 0 12px; font-size: 18px; line-height: 1.3; }

      .card {
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        padding: 12px;
        margin-top: 10px;
        background: rgba(255,255,255,0.055);
      }

      .muted { color: #a1a1aa; font-size: 12px; line-height: 1.45; }
      .error { color: #ff7777; font-size: 13px; line-height: 1.45; }
      .success { color: #86efac; font-size: 13px; line-height: 1.45; }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px;
        background: #111118;
        color: #f5f5f5;
        outline: none;
      }

      input:focus { border-color: #ef4444; }

      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px;
        background: #111118;
        color: #f5f5f5;
        outline: none;
        resize: none;
        font-family: inherit;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid rgba(239,68,68,0.55);
        border-radius: 10px;
        background: #ef4444;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover { filter: brightness(1.08); }

      button.secondary {
        background: transparent;
        color: #f5f5f5;
        border-color: rgba(255,255,255,0.2);
      }

      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }

      ul { margin: 8px 0 0; padding-left: 18px; }
      li { margin: 4px 0; }

      .profile-name { font-size: 16px; font-weight: 800; }
      .section-title { margin-top: 12px; font-weight: 800; font-size: 13px; }
      .title { font-weight: 800; line-height: 1.45; }

      .pill {
        display: inline-block;
        margin: 4px 4px 0 0;
        padding: 5px 8px;
        border-radius: 999px;
        background: rgba(239,68,68,0.16);
        color: #fecaca;
        font-size: 12px;
      }

      .pill.gray {
        background: rgba(255,255,255,0.1);
        color: #d4d4d8;
      }

      .pill.green {
        background: rgba(34,197,94,0.15);
        color: #bbf7d0;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .tab {
        background: transparent;
        color: #f5f5f5;
        border-color: rgba(255,255,255,0.2);
      }

      .tab.active {
        background: #ef4444;
        border-color: #ef4444;
      }

      .score-wrap { margin-top: 10px; }

      .score-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      .score-number {
        font-size: 34px;
        font-weight: 900;
        color: #fecaca;
      }

      .bar {
        height: 12px;
        width: 100%;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
        margin-top: 8px;
      }

      .bar-fill {
        height: 100%;
        background: #ef4444;
        border-radius: 999px;
      }

      .match-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        align-items: center;
        margin-top: 8px;
        font-size: 12px;
      }

      .mini-bar {
        width: 90px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
      }

      .mini-bar-fill {
        height: 100%;
        background: #f87171;
        border-radius: 999px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .score-breakdown {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 8px;
        margin-top: 8px;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <h1>📺 JJKC Algorithm Viewer</h1>

    <div class="tabs">
      <button id="profileTab" class="tab active">내 프로필</button>
      <button id="youtubeTab" class="tab">영상 유사도</button>
    </div>

    <section id="profileSection">
      <div class="card">
        <div class="muted">
          Dashboard에서 <b>Chrome Extension 연결</b> 버튼을 누르면 자동으로 연동됩니다.
          수동 연결이 필요한 경우에만 사용자 ID를 입력하세요.
        </div>
        <input id="userIdInput" placeholder="User ID" />
        <button id="saveBtn">수동 연결</button>
        <button id="clearBtn" class="secondary">연결 해제</button>
      </div>

      <div id="profile" class="card">아직 연결되지 않았습니다.</div>

      <div class="row">
        <button id="dashboardBtn">Dashboard</button>
        <button id="compareBtn" class="secondary">Compare</button>
      </div>
    </section>

    <section id="youtubeSection" style="display:none;">
      <div id="youtubeAnalysis" class="card">
        YouTube 영상 페이지에서 내 알고리즘과 영상 성향의 하이브리드 유사도를 확인할 수 있습니다.
      </div>
      <button id="analyzeYoutubeBtn">현재 영상 유사도 분석</button>
    </section>

    <section id="reviewSection">
      <div class="card">
        <div class="section-title">JJKC 서비스 만족도 평가</div>
        <p class="muted">별점과 간단한 리뷰를 익명으로 남길 수 있습니다.</p>

        <select id="reviewRating">
          <option value="5">★★★★★ 5점</option>
          <option value="4">★★★★☆ 4점</option>
          <option value="3">★★★☆☆ 3점</option>
          <option value="2">★★☆☆☆ 2점</option>
          <option value="1">★☆☆☆☆ 1점</option>
        </select>

        <textarea
          id="reviewText"
          placeholder="간단한 리뷰를 입력하세요."
          rows="3"
          maxlength="500"
        ></textarea>

        <button id="submitReviewBtn">익명 리뷰 제출</button>
        <p id="reviewStatus" class="muted"></p>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
