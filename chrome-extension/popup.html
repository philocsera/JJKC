<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>JJKC Algorithm Viewer</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        background: #fafafa;
        color: #111;
      }

      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
        background: white;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-top: 8px;
      }

      button {
        box-sizing: border-box;
        width: 100%;
        padding: 9px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #111;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: white;
        color: #111;
      }

      ul {
        padding-left: 18px;
        margin: 6px 0 0;
      }

      .muted {
        color: #666;
        font-size: 12px;
      }

      .error {
        color: #c00;
      }
    </style>
  </head>

  <body>
    <h1>📺 JJKC Algorithm Viewer</h1>

    <div class="card">
      <div class="muted">Dashboard에서 복사한 사용자 ID를 붙여넣으세요.</div>
      <input id="userIdInput" placeholder="Paste User ID" />
      <button id="saveBtn">연결</button>
      <button id="clearBtn" class="secondary">연결 해제</button>
    </div>

    <div id="profile" class="card">
      아직 연결되지 않았습니다.
    </div>

    <button id="dashboardBtn">Dashboard 열기</button>
    <button id="compareBtn" class="secondary">Compare 열기</button>

    <script src="popup.js"></script>
  </body>
</html>
