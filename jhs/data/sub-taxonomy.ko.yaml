#   - 키워드는 채널 텍스트(title+description+keywords)에 substring/word-boundary 매칭.
#   - 저장 키는 "상위/세부" 형식: 예) "Gaming/마인크래프트".
#
# ※ Music 카테고리는 프로젝트에서 제외됨 — 여기에도 없음.

